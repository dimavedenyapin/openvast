  - key: gemma-3-27b
    name: Gemma 3 27B (Q4)                 # ~16.5 GB · general, vision, 128K
    hf: unsloth/gemma-3-27b-it-GGUF:Q4_K_M
    min_vram_gb: 24
    disk_gb: 60
    context: 65536
    reasoning: false

  - key: gemma-4-26b-a4b
    name: Gemma 4 26B-A4B MoE (Q4)         # ~17 GB · 4B active, 256K, tools, vision (verify arch)
    hf: unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_XL
    min_vram_gb: 24
    disk_gb: 60
    context: 65536
    reasoning: false

  - key: qwen3.8-27b
    name: Qwen3.8 27B + DFlash2 (Q4)       # 24 GB: 220k safe, 240k redline; 32 GB: full 262k
    hf: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
    draft_hf: z-lab/Qwen3.8-27B-DFlash2-GGUF:Q4_K_M
    llama_cpp_ref: pull/27342/head
    min_vram_gb: 24
    disk_gb: 60
    context: 262144
    context_by_vram:
      24: 220000
      32: 262144
      48: 262144
    image: vastai/llama-cpp:b10331-cuda-12.9
    extra_args: "--jinja -fa on --parallel 1 -t 8 --spec-type draft-dflash --spec-draft-n-max 4 --cache-type-k q4_0 --cache-type-v q4_0 --temperature 1.0 --top-p 0.95 --top-k 30 --min-p 0.0 --presence-penalty 0.0 --metrics"

