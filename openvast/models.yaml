# Model registry for vast-tui.py
#
# `min_vram_gb` drives the "only show GPUs that fit" filter in the launch flow.
# Anything under `defaults` is applied to every model unless the model overrides
# it. Add a new model by copying an entry and changing key / hf / min_vram_gb.
#
# Fields:
#   key           unique id, used as the label on the vast instance + opencode model id
#   name          human label shown in the UI and opencode
#   hf            llama.cpp -hf argument (repo:quant)
#   draft_hf      optional llama.cpp -hfd argument (draft repo:quant)
#   llama_cpp_ref optional upstream git ref to compile inside the instance;
#                 useful for features not yet present in the stock image
#   min_vram_gb   minimum single-card VRAM; offers below this are hidden
#   disk_gb       instance disk size (must exceed the model download size)
#   context       -c context length (real server window)
#   context_by_vram  optional {minimum VRAM GB: context} tiers; the selected
#                    offer determines the launch context and OpenCode limit
#   opencode_context_pct  opencode limit.context as % of context (set to 75 in
#                         `defaults:`; override per model). <100 leaves a buffer so
#                         auto-compact fires before a big turn overshoots the server.
#   port          container port llama-server binds (default 18000)
#   image         docker image (default from `defaults.image`)
#   extra_args    extra llama-server flags
#   output_limit  opencode output token limit
#   tool_call     advertise tool calling to opencode
#   reasoning     model emits reasoning_content (thinking)
#   reasoning_effort  reasoning effort sent by opencode (default medium)
#
# Sizes below are the Q4 GGUF footprint, verified against the HuggingFace API.
# min_vram_gb is set to the smallest common vast card tier that holds the model
# plus room for KV cache / compute buffers.

defaults:
  image: vastai/llama-cpp:b9628-cuda-12.9
  port: 18000
  extra_args: "--jinja -fa on --cache-type-k q8_0 --cache-type-v q8_0 --metrics --parallel 1"
  output_limit: 8192
  opencode_context_pct: 75   # global: opencode limit.context = context × 75% (buffer for 1-turn overshoot)
  tool_call: true
  reasoning: true
  reasoning_effort: medium

default_model: qwen3.6-35b-a3b

models:
  # ----------------------------------------------------------------- 16 GB tier
  - key: gpt-oss-20b
    name: gpt-oss 20B (OpenAI, Q4)         # ~11.6 GB · reasoning MoE, fast
    hf: unsloth/gpt-oss-20b-GGUF:Q4_K_M
    min_vram_gb: 16
    disk_gb: 50
    context: 65536

  - key: qwen3-14b
    name: Qwen3 14B (Q4)                   # ~9.0 GB
    hf: unsloth/Qwen3-14B-GGUF:Q4_K_M
    min_vram_gb: 16
    disk_gb: 50
    context: 65536

  - key: phi-4
    name: Phi-4 14B (Q4)                   # ~8.9 GB · reasoning-light
    hf: unsloth/phi-4-GGUF:Q4_K_M
    min_vram_gb: 16
    disk_gb: 50
    context: 16384
    reasoning: false

  - key: gemma-4-12b
    name: Gemma 4 12B dense (Q4)           # ~7.1 GB · vision (verify arch support)
    hf: unsloth/gemma-4-12b-it-GGUF:Q4_K_M
    min_vram_gb: 16
    disk_gb: 50
    context: 65536
    reasoning: false

  # ----------------------------------------------------------------- 24 GB tier
  - key: devstral-small-2507
    name: Devstral Small 2507 24B (Q4)     # ~14.3 GB · agentic CODING specialist
    hf: unsloth/Devstral-Small-2507-GGUF:Q4_K_M
    min_vram_gb: 24
    disk_gb: 60
    context: 65536
    reasoning: false

  - key: mistral-small-3.2-24b
    name: Mistral Small 3.2 24B (Q4)       # ~14.3 GB · general + tools, vision
    hf: unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF:Q4_K_M
    min_vram_gb: 24
    disk_gb: 60
    context: 65536
